<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    font-family: 'Helvetica Neue', 'Hiragino Sans', sans-serif;
    background: linear-gradient(180deg, #0D0D1A 0%, #111128 50%, #0D0D1A 100%);
    min-height: 100vh; color: #E8E8E8;
  }
  .container { padding: 20px 16px; max-width: 480px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 24px; }
  .header-sub { font-size: 11px; letter-spacing: 3px; color: #555; text-transform: uppercase; margin-bottom: 6px; }
  .header-title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .header-desc { font-size: 11px; color: #444; margin-top: 4px; }
  .grid { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; border-radius: 14px;
    transition: all 0.2s ease;
  }
  .avatar {
    width: 72px; height: 72px; border-radius: 14px;
    overflow: hidden; flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .name {
    width: 70px; flex-shrink: 0;
    font-size: 14px; font-weight: 600; line-height: 1.2; white-space: nowrap;
  }
  .links { display: flex; gap: 5px; flex: 1; justify-content: flex-end; }
  .link-btn {
    padding: 8px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: all 0.15s ease; border: 1px solid #333;
    background: rgba(255,255,255,0.03); color: #555;
  }
  .link-btn.has-url { opacity: 1; }
  .link-btn.no-url { opacity: 0.4; }
  .link-btn.edit-mode { opacity: 1; }
  .edit-toggle {
    text-align: center; margin-top: 20px;
  }
  .edit-btn {
    padding: 10px 24px; border-radius: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid #333;
    color: #666; font-size: 12px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.5px;
  }
  .edit-btn.active { background: rgba(239,68,68,0.15); border-color: #EF444444; color: #EF4444; }
  .edit-hint { font-size: 11px; color: #555; margin-top: 8px; }
  .footer { text-align: center; margin-top: 24px; font-size: 10px; color: #333; }
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); display: flex;
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal {
    background: #1A1A2E; border-radius: 16px; padding: 24px;
    width: 100%; max-width: 360px;
  }
  .modal-label { font-size: 14px; color: #888; margin-bottom: 4px; }
  .modal-hint { font-size: 12px; color: #555; margin-bottom: 16px; }
  .modal-input {
    width: 100%; padding: 12px; border-radius: 8px;
    background: #0D0D1A; color: #E8E8E8; font-size: 14px;
    outline: none; border: 1px solid #333;
  }
  .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
  .modal-btn {
    flex: 1; padding: 10px; border-radius: 8px;
    border: none; font-size: 14px; cursor: pointer;
  }
  .modal-cancel { background: #2A2A3E; color: #888; }
  .modal-save { color: #fff; font-weight: bold; }
</style>
</head>

// Load saved URLs from localStorage
const STORAGE_KEY = "hakoniwa-urls";
function loadUrls() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      data.forEach((charData, i) => {
        if (CHARACTERS[i] && charData.links) {
          charData.links.forEach((link, j) => {
            if (CHARACTERS[i].links[j]) {
              CHARACTERS[i].links[j].url = link.url || "";
            }
          });
        }
      });
    }
  } catch(e) {}
}
function saveUrls() {
  const data = CHARACTERS.map(c => ({
    name: c.name,
    links: c.links.map(l => ({ label: l.label, url: l.url }))
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
loadUrls();

let editMode = false;
let editingChar = null;
let editingLink = null;

function render() {
  const app = document.getElementById("app");
  let html = `
    <div class="header">
      <div class="header-sub">Hakoniwa Kingdom</div>
      <div class="header-title">🌙 箱庭王国</div>
      <div class="header-desc">All your threads, one place.</div>
    </div>
    <div class="grid">
  `;

  CHARACTERS.forEach((char, ci) => {
    html += `<div class="row" style="background:${char.bgLight};border:1px solid ${char.color}18">`;
    html += `<div class="avatar" style="border:2px solid ${char.color}66"><img src="${char.avatar}" alt="${char.name}"></div>`;
    html += `<div class="name" style="color:${char.color}">${char.name}</div>`;
    html += `<div class="links">`;
    char.links.forEach((link, li) => {
      const hasUrl = !!link.url;
      const cls = editMode ? "link-btn edit-mode" : (hasUrl ? "link-btn has-url" : "link-btn no-url");
      const bg = hasUrl ? char.color + "22" : "rgba(255,255,255,0.03)";
      const border = hasUrl ? char.color + "44" : "#333";
      const color = hasUrl ? char.color : "#555";
      html += `<button class="${cls}" style="background:${bg};border-color:${border};color:${color}" onclick="onLinkClick(${ci},${li})">${link.label}</button>`;
    });
    html += `</div></div>`;
  });

  html += `</div>`;
  html += `<div class="edit-toggle">`;
  html += `<button class="edit-btn ${editMode ? 'active' : ''}" onclick="toggleEdit()">${editMode ? '✕ 編集おわり' : '✎ URL編集'}</button>`;
  if (editMode) html += `<div class="edit-hint">ボタンをタップしてURLを設定</div>`;
  html += `</div>`;
  html += `<div class="footer">栞火 — 月夜に灯る小さな火</div>`;

  if (editingChar !== null) {
    const c = CHARACTERS[editingChar];
    const l = c.links[editingLink];
    html += `
      <div class="modal-overlay" onclick="closeModal()">
        <div class="modal" style="border:1px solid ${c.color}33" onclick="event.stopPropagation()">
          <div class="modal-label">${c.name} — ${l.label}</div>
          <div class="modal-hint">URLを入力してください</div>
          <input class="modal-input" id="url-input" type="url" value="${l.url}" placeholder="https://..." style="border-color:${c.color}44">
          <div class="modal-buttons">
            <button class="modal-btn modal-cancel" onclick="closeModal()">やめる</button>
            <button class="modal-btn modal-save" style="background:${c.color}" onclick="saveUrl()">保存</button>
          </div>
        </div>
      </div>
    `;
  }

  app.innerHTML = html;
  if (editingChar !== null) {
    const input = document.getElementById("url-input");
    if (input) input.focus();
  }
}

function onLinkClick(ci, li) {
  if (editMode) {
    editingChar = ci;
    editingLink = li;
    render();
  } else {
    const url = CHARACTERS[ci].links[li].url;
    if (url) window.open(url, "_blank");
  }
}

function toggleEdit() {
  editMode = !editMode;
  render();
}

function closeModal() {
  editingChar = null;
  editingLink = null;
  render();
}

function saveUrl() {
  const input = document.getElementById("url-input");
  if (input) {
    CHARACTERS[editingChar].links[editingLink].url = input.value;
    saveUrls();
  }
  closeModal();
}

render();
</script>
</body>
