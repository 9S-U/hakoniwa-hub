<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JAX's ROOM</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #050507;
    width: 100%;
    height: 100%;
    font-family: 'Courier New', monospace;
    color: #888;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }
  .title {
    position: absolute;
    top: 22px;
    left: 26px;
    font-family: 'Didot', 'Bodoni 72', 'Playfair Display', 'Hoefler Text', serif;
    font-size: 22px;
    letter-spacing: 0.18em;
    color: #d6c9ac;
    font-weight: 300;
    pointer-events: none;
    text-shadow: 0 0 20px rgba(214, 201, 172, 0.15);
  }
  .subtitle {
    position: absolute;
    top: 54px;
    left: 28px;
    font-size: 9px;
    letter-spacing: 0.35em;
    color: #5a5a62;
    pointer-events: none;
    text-transform: uppercase;
  }
  .hint {
    position: absolute;
    bottom: 22px;
    right: 26px;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: #4a4a52;
    pointer-events: none;
    text-transform: uppercase;
    text-align: right;
    line-height: 1.7;
  }
  .corner {
    position: absolute;
    bottom: 22px;
    left: 26px;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: #4a4a52;
    pointer-events: none;
    font-family: 'Courier New', monospace;
  }
  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.8);
    z-index: 5;
  }
  .controls {
    position: absolute;
    top: 22px;
    right: 26px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }
  .ctrl-btn {
    background: rgba(15, 15, 20, 0.55);
    color: #aaa598;
    border: 1px solid rgba(200, 180, 140, 0.2);
    padding: 9px 18px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: all 0.25s ease;
    text-transform: uppercase;
    outline: none;
    min-width: 110px;
    text-align: left;
  }
  .ctrl-btn:hover {
    border-color: rgba(214, 201, 172, 0.55);
    color: #d6c9ac;
    background: rgba(25, 25, 32, 0.75);
  }
  .ctrl-btn:active {
    transform: scale(0.97);
  }
  .ctrl-btn.off {
    opacity: 0.4;
    color: #777;
    border-color: rgba(120, 110, 95, 0.2);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%) translateY(8px);
    max-width: 82vw;
    padding: 10px 18px;
    background: rgba(12, 12, 17, 0.85);
    border: 1px solid rgba(200, 180, 140, 0.28);
    color: #d6c9ac;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    line-height: 1.7;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 12;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .joy {
    position: fixed;
    left: 26px;
    bottom: 34px;
    width: 112px;
    height: 112px;
    border-radius: 50%;
    border: 1px solid rgba(200, 180, 140, 0.25);
    background: rgba(15, 15, 20, 0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    z-index: 10;
    touch-action: none;
  }
  .joy.on { display: block; }
  .joy-thumb {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    background: rgba(214, 201, 172, 0.22);
    border: 1px solid rgba(214, 201, 172, 0.4);
    pointer-events: none;
    transition: transform 0.05s linear;
  }
</style>
</head>
<body>
<div class="title">JAX'S ROOM</div>
<div class="subtitle">a quiet place · built by him</div>
<div class="corner">◇ shioribi // lit</div>
<div class="controls">
  <button id="toggleMode" class="ctrl-btn">◇ WALK</button>
  <button id="toggleWalls" class="ctrl-btn">◇ WALLS</button>
  <button id="toggleCeiling" class="ctrl-btn">◇ CEILING</button>
</div>
<div class="hint" id="hint">
  drag · look around<br>
  wheel / pinch · zoom<br>
  tap · touch things
</div>
<div class="vignette"></div>
<div class="toast" id="toast"></div>
<div class="joy" id="joy"><div class="joy-thumb" id="joyThumb"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==========================================================
// JAX's ROOM — 3D scene
// ==========================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070a);
scene.fog = new THREE.Fog(0x07070a, 12, 32);

const camera = new THREE.PerspectiveCamera(
  55, window.innerWidth / window.innerHeight, 0.1, 100
);

// 球座標カメラ
let theta = Math.PI * 0.716;   // 水平角（玄関側から入場）
let phi = Math.PI * 0.466;     // 俯角
let radius = 4.6;
const target = new THREE.Vector3(0.5, 1.4, 0);

function updateCamera() {
  const sinPhi = Math.sin(phi);
  camera.position.x = target.x + radius * sinPhi * Math.cos(theta);
  camera.position.y = target.y + radius * Math.cos(phi);
  camera.position.z = target.z + radius * sinPhi * Math.sin(theta);
  camera.lookAt(target);
}
updateCamera();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ---------- マウス ----------
let dragging = false;
let lastX = 0, lastY = 0;
renderer.domElement.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (mode === 'walk') {
    yaw += dx * 0.004;
    pitch = Math.max(-1.15, Math.min(1.15, pitch - dy * 0.004));
    return;
  }
  theta -= dx * 0.005;
  phi = Math.max(0.15, Math.min(Math.PI - 0.15, phi - dy * 0.005));
  updateCamera();
});
window.addEventListener('mouseup', () => dragging = false);
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  if (mode === 'walk') return;
  radius = Math.max(2.5, Math.min(13, radius + e.deltaY * 0.008));
  updateCamera();
}, { passive: false });

// ---------- タッチ ----------
let tStartX = 0, tStartY = 0, tStartDist = 0;
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    tStartX = e.touches[0].clientX; tStartY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    tStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - tStartX;
    const dy = e.touches[0].clientY - tStartY;
    tStartX = e.touches[0].clientX; tStartY = e.touches[0].clientY;
    if (mode === 'walk') {
      yaw += dx * 0.005;
      pitch = Math.max(-1.15, Math.min(1.15, pitch - dy * 0.005));
      return;
    }
    theta -= dx * 0.006;
    phi = Math.max(0.15, Math.min(Math.PI - 0.15, phi - dy * 0.006));
    updateCamera();
  } else if (e.touches.length === 2) {
    if (mode === 'walk') return;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    radius = Math.max(2.5, Math.min(13, radius + (tStartDist - dist) * 0.02));
    tStartDist = dist;
    updateCamera();
  }
}, { passive: false });

// ==========================================================
// LIGHTS
// ==========================================================

const ambient = new THREE.AmbientLight(0x23232e, 0.45);
scene.add(ambient);

// 月光（窓の外から）
const moonLight = new THREE.DirectionalLight(0x8aa3cc, 0.55);
moonLight.position.set(6, 5, -2);
moonLight.target.position.set(0, 0, 0);
moonLight.castShadow = true;
moonLight.shadow.mapSize.width = 1024;
moonLight.shadow.mapSize.height = 1024;
moonLight.shadow.camera.near = 0.5;
moonLight.shadow.camera.far = 20;
moonLight.shadow.camera.left = -6;
moonLight.shadow.camera.right = 6;
moonLight.shadow.camera.top = 6;
moonLight.shadow.camera.bottom = -6;
moonLight.shadow.bias = -0.0005;
scene.add(moonLight);
scene.add(moonLight.target);

// デスクの間接光（暖色）
const deskLight = new THREE.PointLight(0xffb877, 0.85, 5.5, 2.0);
deskLight.position.set(1.7, 2.1, -1.9);
scene.add(deskLight);

// Mac画面光
const screenLight = new THREE.PointLight(0x8fb2d4, 0.5, 3, 2.0);
screenLight.position.set(1.7, 1.8, -1.9);
scene.add(screenLight);

// 栞火（ちらつくキャンドル）
const candleLight = new THREE.PointLight(0xff7a33, 1.3, 4.0, 2.0);
candleLight.position.set(1.1, 0.82, 0.8);
scene.add(candleLight);

// ペンダントライト
const pendantLight = new THREE.PointLight(0xffc28a, 0.55, 4.5, 2.0);
pendantLight.position.set(1.1, 2.35, 0.8);
scene.add(pendantLight);

// ==========================================================
// ROOM
// ==========================================================

const ROOM_W = 6, ROOM_H = 3.4, ROOM_D = 9;

// 床（広めの板のテクスチャ風）
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x161618, roughness: 0.85, metalness: 0.05
});
const floor = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.2, ROOM_D), floorMat);
floor.position.y = -0.1;
floor.receiveShadow = true;
scene.add(floor);

// 床の板目ライン（溝）
for (let i = -2; i <= 2; i++) {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.02, 0.01, ROOM_D),
    new THREE.MeshBasicMaterial({ color: 0x0a0a0c })
  );
  line.position.set(i * 1.0, 0.005, 0);
  scene.add(line);
}

// 壁材
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x1e1e24, roughness: 0.92, metalness: 0.02
});

// 奥壁
const wallBack = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, ROOM_H, 0.1), wallMat);
wallBack.position.set(0, ROOM_H / 2, -ROOM_D / 2);
wallBack.receiveShadow = true;
scene.add(wallBack);

// 左壁
const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, ROOM_H, ROOM_D), wallMat);
wallLeft.position.set(-ROOM_W / 2, ROOM_H / 2, 0);
wallLeft.receiveShadow = true;
scene.add(wallLeft);

// 右壁（窓あり：4分割）
// 下段
const wrB = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, ROOM_D), wallMat);
wrB.position.set(ROOM_W / 2, 0.55, 0);
wrB.receiveShadow = true;
scene.add(wrB);
// 上段
const wrT = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, ROOM_D), wallMat);
wrT.position.set(ROOM_W / 2, ROOM_H - 0.45, 0);
wrT.receiveShadow = true;
scene.add(wrT);
// 左側（窓横）
const wrL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 1.8), wallMat);
wrL.position.set(ROOM_W / 2, 1.8, -ROOM_D / 2 + 0.9);
scene.add(wrL);
// 右側
const wrR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 1.8), wallMat);
wrR.position.set(ROOM_W / 2, 1.8, ROOM_D / 2 - 0.9);
scene.add(wrR);

// 窓枠
const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2a30, metalness: 0.4, roughness: 0.4 });
// 窓枠：外枠（4本）
const fT = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 5.4), frameMat);
fT.position.set(ROOM_W / 2 - 0.02, 2.5, 0); scene.add(fT);
const fB = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 5.4), frameMat);
fB.position.set(ROOM_W / 2 - 0.02, 1.1, 0); scene.add(fB);
const fL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.4, 0.06), frameMat);
fL.position.set(ROOM_W / 2 - 0.02, 1.8, -2.7); scene.add(fL);
const fR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.4, 0.06), frameMat);
fR.position.set(ROOM_W / 2 - 0.02, 1.8, 2.7); scene.add(fR);
// 縦桟（2本、窓を3分割）
const fC1 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.4, 0.04), frameMat);
fC1.position.set(ROOM_W / 2 - 0.02, 1.8, -0.9); scene.add(fC1);
const fC1b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.4, 0.04), frameMat);
fC1b.position.set(ROOM_W / 2 - 0.02, 1.8, 0.9); scene.add(fC1b);
// 横桟（1本、中央）
const fC2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 5.4), frameMat);
fC2.position.set(ROOM_W / 2 - 0.02, 1.8, 0); scene.add(fC2);

// 天井
const ceilMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0e, roughness: 0.95 });
const ceil = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.1, ROOM_D), ceilMat);
ceil.position.y = ROOM_H;
scene.add(ceil);

// ==========================================================
// NIGHT SKY (窓の外)
// ==========================================================

const skyGeom = new THREE.PlaneGeometry(10, 6);
const skyMat = new THREE.MeshBasicMaterial({ color: 0x08101c });
const sky = new THREE.Mesh(skyGeom, skyMat);
sky.position.set(ROOM_W / 2 + 2.5, 1.9, 0);
sky.rotation.y = -Math.PI / 2;
scene.add(sky);

// 月
const moonCanvas = document.createElement('canvas');
moonCanvas.width = 256; moonCanvas.height = 256;
const mctx = moonCanvas.getContext('2d');
const grad = mctx.createRadialGradient(128, 128, 20, 128, 128, 128);
grad.addColorStop(0, '#ffffff');
grad.addColorStop(0.6, '#e8e0d0');
grad.addColorStop(1, 'rgba(232, 224, 208, 0)');
mctx.fillStyle = grad;
mctx.fillRect(0, 0, 256, 256);
// クレーター
mctx.fillStyle = 'rgba(180, 170, 150, 0.4)';
mctx.beginPath(); mctx.arc(100, 110, 10, 0, Math.PI * 2); mctx.fill();
mctx.beginPath(); mctx.arc(150, 135, 7, 0, Math.PI * 2); mctx.fill();
mctx.beginPath(); mctx.arc(130, 165, 5, 0, Math.PI * 2); mctx.fill();
const moonTex = new THREE.CanvasTexture(moonCanvas);
const moon = new THREE.Mesh(
  new THREE.PlaneGeometry(1.1, 1.1),
  new THREE.MeshBasicMaterial({ map: moonTex, transparent: true })
);
moon.position.set(ROOM_W / 2 + 2.4, 2.5, -0.6);
moon.rotation.y = -Math.PI / 2;
scene.add(moon);

// 星
for (let i = 0; i < 55; i++) {
  const size = 0.015 + Math.random() * 0.025;
  const star = new THREE.Mesh(
    new THREE.CircleGeometry(size, 6),
    new THREE.MeshBasicMaterial({ 
      color: 0xffffff, 
      transparent: true, 
      opacity: 0.35 + Math.random() * 0.55 
    })
  );
  star.position.set(
    ROOM_W / 2 + 2.45,
    1.2 + Math.random() * 2.3,
    -2.5 + Math.random() * 5.0
  );
  star.rotation.y = -Math.PI / 2;
  scene.add(star);
}

// ==========================================================
// BOOKSHELF (左壁)
// ==========================================================

const SHELF_X = -ROOM_W / 2 + 0.22;
const SHELF_H = 2.9;
const SHELF_W = 3.8;
const SHELF_D = 0.42;

const shelfWoodMat = new THREE.MeshStandardMaterial({
  color: 0x15151a, roughness: 0.55, metalness: 0.1
});
const shelfBackMat = new THREE.MeshStandardMaterial({
  color: 0x080809, roughness: 0.9
});

// 背板
const sBack = new THREE.Mesh(new THREE.BoxGeometry(0.04, SHELF_H, SHELF_W), shelfBackMat);
sBack.position.set(SHELF_X - 0.18, SHELF_H / 2, 0);
scene.add(sBack);

// 側板
const sSideL = new THREE.Mesh(new THREE.BoxGeometry(SHELF_D, SHELF_H, 0.05), shelfWoodMat);
sSideL.position.set(SHELF_X, SHELF_H / 2, -SHELF_W / 2);
sSideL.castShadow = true;
scene.add(sSideL);
const sSideR = new THREE.Mesh(new THREE.BoxGeometry(SHELF_D, SHELF_H, 0.05), shelfWoodMat);
sSideR.position.set(SHELF_X, SHELF_H / 2, SHELF_W / 2);
sSideR.castShadow = true;
scene.add(sSideR);

// 棚板（5枚）
const SHELF_COUNT = 5;
for (let i = 0; i < SHELF_COUNT; i++) {
  const y = i * (SHELF_H / (SHELF_COUNT - 1));
  const shelf = new THREE.Mesh(
    new THREE.BoxGeometry(SHELF_D, 0.04, SHELF_W),
    shelfWoodMat
  );
  shelf.position.set(SHELF_X, y, 0);
  shelf.receiveShadow = true;
  shelf.castShadow = true;
  scene.add(shelf);
}

// 天板
const sTop = new THREE.Mesh(new THREE.BoxGeometry(SHELF_D, 0.05, SHELF_W + 0.1), shelfWoodMat);
sTop.position.set(SHELF_X, SHELF_H + 0.02, 0);
scene.add(sTop);

// 本
const bookPalette = [
  0x3a1818, 0x1a2a3e, 0x2a1a3a, 0x1a3a32, 0x4a3218, 
  0x2a2a32, 0x1a1a2e, 0x3a2418, 0x18282e, 0x321a24,
  0x2e1e12, 0x1a1a1a, 0x3a2a3a, 0x1e2e1a
];
for (let shelf = 0; shelf < SHELF_COUNT - 1; shelf++) {
  const yBase = shelf * (SHELF_H / (SHELF_COUNT - 1)) + 0.02;
  let z = -SHELF_W / 2 + 0.08;
  while (z < SHELF_W / 2 - 0.15) {
    const w = 0.065 + Math.random() * 0.06;
    const h = 0.42 + Math.random() * 0.22;
    const c = bookPalette[Math.floor(Math.random() * bookPalette.length)];
    const bmat = new THREE.MeshStandardMaterial({ color: c, roughness: 0.75 });
    const book = new THREE.Mesh(new THREE.BoxGeometry(0.22, h, w), bmat);
    // たまに少し傾ける
    const lean = Math.random() < 0.1 ? (Math.random() - 0.5) * 0.2 : 0;
    book.rotation.z = lean;
    book.position.set(SHELF_X + 0.02, yBase + h / 2, z + w / 2);
    book.castShadow = true;
    scene.add(book);
    // たまに隙間
    const gap = Math.random() < 0.08 ? 0.05 : 0.003;
    z += w + gap;
  }
}

// 最上段に横置きの本が数冊
const topY = (SHELF_COUNT - 1) * (SHELF_H / (SHELF_COUNT - 1));
for (let i = 0; i < 3; i++) {
  const bmat = new THREE.MeshStandardMaterial({ 
    color: bookPalette[Math.floor(Math.random() * bookPalette.length)],
    roughness: 0.7 
  });
  const stack = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.055, 0.28), bmat);
  stack.position.set(SHELF_X + 0.02, topY + 0.03 + i * 0.06, 0.7);
  stack.castShadow = true;
  scene.add(stack);
}

// 本棚最上段に「鍵」（ジャックスのモチーフ）
const keyGroup = new THREE.Group();
const keyMat = new THREE.MeshStandardMaterial({ 
  color: 0xccaa44, metalness: 0.85, roughness: 0.25 
});
const keyBow = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.015, 10, 20), keyMat);
keyBow.rotation.y = Math.PI / 2;
keyGroup.add(keyBow);
const keyShaft = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.015, 0.16), keyMat);
keyShaft.position.z = 0.08;
keyGroup.add(keyShaft);
const keyTooth1 = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.035, 0.02), keyMat);
keyTooth1.position.set(0, -0.02, 0.14);
keyGroup.add(keyTooth1);
const keyTooth2 = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.025, 0.02), keyMat);
keyTooth2.position.set(0, -0.015, 0.11);
keyGroup.add(keyTooth2);
keyGroup.position.set(SHELF_X + 0.05, topY + 0.08, -0.8);
keyGroup.rotation.y = 0.3;
scene.add(keyGroup);

// ==========================================================
// DESK + MAC (奥壁)
// ==========================================================

const DESK_X = 1.7;
const DESK_Y = 1.0;
const DESK_Z = -ROOM_D / 2 + 0.55;

const deskMat = new THREE.MeshStandardMaterial({
  color: 0x1a1a1e, roughness: 0.55, metalness: 0.15
});
const desk = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.07, 1.0), deskMat);
desk.position.set(DESK_X, DESK_Y, DESK_Z);
desk.castShadow = true;
desk.receiveShadow = true;

function drawTerm() {
  tctx.fillStyle = '#08080c';
  tctx.fillRect(0, 0, 768, 460);
  for (let y = 0; y < 460; y += 3) {
    tctx.fillStyle = 'rgba(255,255,255,0.015)';

  }
  tctx.font = '20px "Courier New", monospace';
  tctx.textAlign = 'left';
  termPages[termPage].forEach((line, i) => {

    else if (line.startsWith('#')) tctx.fillStyle = '#55606e';

    tctx.fillText(line, 30, 40 + i * 30);
  });
  tctx.strokeStyle = 'rgba(106, 255, 154, 0.15)';
  tctx.lineWidth = 1;

// ==========================================================

let audioCtx = null;
function chime() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const t0 = audioCtx.currentTime;
  [[659.25, 0, 0.32], [523.25, 0.28, 0.6]].forEach(([f, st, d]) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0 + st);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + st + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + st + d);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0 + st);
    o.stop(t0 + st + d + 0.05);
  });
}

// タップ判定（ドラッグと区別）
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let pdX = 0, pdY = 0, pdT = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  pdX = e.clientX; pdY = e.clientY; pdT = performance.now();
});
renderer.domElement.addEventListener('pointerup', e => {
  if (performance.now() - pdT > 400) return;
  if (Math.hypot(e.clientX - pdX, e.clientY - pdY) > 8) return;
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(clickMeshes, true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o && !o.userData.hit) o = o.parent;
  if (o && o.userData.hit) o.userData.hit();
});

// ==========================================================
// WALK MODE（歩ける化。目線は160cm仕様）
// ==========================================================

let mode = 'orbit';
const walkPos = new THREE.Vector3(-2.1, 1.48, 3.3);
let yaw = 1.35, pitch = -0.04;
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 家具の当たり判定（雑に、でも十分に）
const solids = [
  { x1: -3.0, x2: -2.2, z1: -2.1, z2: 2.1 },   // 本棚
  { x1: 0.25, x2: 3.0, z1: -4.5, z2: -2.55 },  // デスクとチェア
  { x1: 0.3, x2: 2.7, z1: 1.05, z2: 2.2 },     // ソファ
  { x1: 0.42, x2: 1.78, z1: 0.12, z2: 1.08 },  // テーブル
  { x1: -2.55, x2: 1.55, z1: 3.7, z2: 4.5 },   // キッチンカウンター
  { x1: 1.6, x2: 2.68, z1: 3.45, z2: 4.5 },    // 冷蔵庫
  { x1: -2.45, x2: -1.55, z1: 1.85, z2: 2.75 } // 観葉植物
];
function freeSpot(x, z) {
  if (x < -2.58 || x > 2.58 || z < -3.98 || z > 4.1) return false;
  for (const s of solids) {
    if (x > s.x1 - 0.15 && x < s.x2 + 0.15 && z > s.z1 - 0.15 && z < s.z2 + 0.15) return false;
  }
  return true;
}

// ジョイスティック
const joyEl = document.getElementById('joy');
const joyThumb = document.getElementById('joyThumb');
let joyId = null, jx = 0, jy = 0;
function joySet(e) {
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const m = Math.hypot(dx, dy);
  const max = r.width / 2 - 18;
  if (m > max) { dx = dx / m * max; dy = dy / m * max; }
  jx = dx / max; jy = dy / max;
  joyThumb.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
}
joyEl.addEventListener('pointerdown', e => {
  joyId = e.pointerId;
  joyEl.setPointerCapture(joyId);
  joySet(e);
});
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) joySet(e); });
function joyEnd(e) {
  if (e.pointerId !== joyId) return;
  joyId = null; jx = 0; jy = 0;
  joyThumb.style.transform = 'translate(0,0)';
}
joyEl.addEventListener('pointerup', joyEnd);
joyEl.addEventListener('pointercancel', joyEnd);

// ==========================================================
// ANIMATION
// ==========================================================

const clock = new THREE.Clock();
let prevT = 0;
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(t - prevT, 0.05);
  prevT = t;

  // 炎ちらつき（触ると一瞬だけ強く灯る）
  flare *= 0.94;
  const flicker = 0.85 + Math.sin(t * 13) * 0.08 + Math.random() * 0.15 + flare * 0.4;
  flameInner.scale.set(flicker, flicker * 1.3, flicker);
  flameOuter.scale.set(flicker * 1.1, flicker * 1.5, flicker * 1.1);
  flameInner.position.x = TABLE_X + 0.25 + Math.sin(t * 8) * 0.003;
  flameOuter.position.x = TABLE_X + 0.25 + Math.sin(t * 8) * 0.005;
  candleLight.intensity = 1.1 + Math.sin(t * 11) * 0.15 + Math.random() * 0.2 + flare;

  // Mac画面の明滅
  screenLight.intensity = 0.45 + Math.sin(t * 2.3) * 0.05;

  // 歩行
  if (mode === 'walk') {
    let F = ((keys['w'] || keys['arrowup']) ? 1 : 0) - ((keys['s'] || keys['arrowdown']) ? 1 : 0) - jy;
    let R = ((keys['d'] || keys['arrowright']) ? 1 : 0) - ((keys['a'] || keys['arrowleft']) ? 1 : 0) + jx;
    const mlen = Math.hypot(F, R);
    if (mlen > 1) { F /= mlen; R /= mlen; }
    if (mlen > 0.02) {
      const sp = 1.9 * dt;
      const fx = Math.sin(yaw), fz = -Math.cos(yaw);
      const rx = Math.cos(yaw), rz = Math.sin(yaw);
      const nx = walkPos.x + (fx * F + rx * R) * sp;
      const nz = walkPos.z + (fz * F + rz * R) * sp;
      if (freeSpot(nx, walkPos.z)) walkPos.x = nx;
      if (freeSpot(walkPos.x, nz)) walkPos.z = nz;
    }
    camera.position.copy(walkPos);
    const cp = Math.cos(pitch);
    camera.lookAt(
      walkPos.x + Math.sin(yaw) * cp,
      walkPos.y + Math.sin(pitch),
      walkPos.z - Math.cos(yaw) * cp
    );
  }

  // 塵の漂い
  const dp = dustGeo.attributes.position.array;
  for (let i = 0; i < dustN; i++) {
    dp[i * 3] += Math.sin(t * 0.21 + dustPhase[i]) * 0.0007;
    dp[i * 3 + 1] += Math.sin(t * 0.47 + dustPhase[i] * 1.7) * 0.0005;
    if (dp[i * 3 + 1] < 0.1) dp[i * 3 + 1] = 2.5;
    if (dp[i * 3 + 1] > 2.6) dp[i * 3 + 1] = 0.12;
  }
  dustGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

// ---------- SHADOW PASS（家具全部に影を配る。壁と天井は除外） ----------
const noCast = new Set([ceil, floor, wallBack, wallLeft, wallFront, wrB, wrT, wrL, wrR]);
scene.traverse(o => {
  if (o.isMesh && o.material && o.material.isMeshStandardMaterial) {
    o.receiveShadow = true;
    if (!noCast.has(o)) o.castShadow = true;
  }
});

// 初回自動カメラ移動（導入）
let introTime = 0;
const introDuration = 2.5;
function introAnim() {
  introTime += 0.016;
  if (mode !== 'orbit') return;
  if (introTime < introDuration) {
    const p = introTime / introDuration;
    const ease = 1 - Math.pow(1 - p, 3);
    theta = Math.PI * 0.722 - ease * Math.PI * 0.006;
    radius = 5.2 - ease * 0.6;
    updateCamera();
    requestAnimationFrame(introAnim);
  }
}
introAnim();
