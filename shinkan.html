<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>箱庭王国ハブ・新館</title>
<meta name="theme-color" content="#12111a">
<link rel="apple-touch-icon" href="shinkan_icon.PNG">
<link rel="icon" type="image/png" href="shinkan_icon.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12111a; --panel:#1b1a26; --panel2:#232231; --paper:#ece6d9; --dim:#b7b0a2;
  --lamp:#d9b36a; --line:rgba(236,230,217,.14); --line2:rgba(236,230,217,.26);
  --danger:#d96a6a; --ok:#8fbf8f;
  --serif:"Shippori Mincho","Hiragino Mincho ProN",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.75;
  min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;font-size:15px}
input,textarea,select{font-family:var(--sans);font-size:16px;color:var(--paper);background:var(--panel2);
  border:1px solid var(--line2);border-radius:8px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
textarea{line-height:1.7;resize:vertical}
::placeholder{color:rgba(236,230,217,.35)}
a{color:var(--lamp)}
.hide{display:none!important}

/* ---- 共通部品 ---- */
.screen{max-width:760px;margin:0 auto;padding:18px 16px 90px}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel);color:var(--paper);font-weight:500}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--lamp);color:#1c1710;border-color:var(--lamp);font-weight:700}
.btn.ghost{border-color:transparent;color:var(--dim)}
.btn.danger{color:var(--danger);border-color:rgba(217,106,106,.4)}
.btn.small{padding:5px 11px;font-size:13px}
.rule{height:1px;background:var(--line);margin:16px 0}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;letter-spacing:.12em;color:var(--dim);margin-bottom:6px}
.hint{font-size:12px;color:var(--dim);line-height:1.7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.chip{display:inline-block;font-size:11px;letter-spacing:.08em;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
a.chip.door{color:var(--lamp);border-color:rgba(217,179,106,.55);text-decoration:none;font-weight:500}

/* ---- 施錠画面 ---- */
#scr-lock,#scr-setup{display:flex;flex-direction:column;justify-content:center;min-height:92dvh;max-width:420px;margin:0 auto;padding:24px}
.lock-title{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.14em;text-align:center;margin:10px 0 2px}
.lock-sub{font-family:var(--serif);text-align:center;color:var(--dim);letter-spacing:.5em;font-size:13px;margin-bottom:8px;padding-left:.5em}
.lock-key{text-align:center;color:var(--lamp);font-size:22px;letter-spacing:.2em}
.lock-rule{width:56px;height:1px;background:var(--lamp);opacity:.7;margin:18px auto 26px}

/* ---- 玄関（台帳） ---- */
.hall-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.hall-title{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.08em}
.hall-sub{font-size:12px;color:var(--dim);letter-spacing:.2em;margin-bottom:14px}
.sortbar{display:flex;gap:8px;align-items:center;margin:10px 0 16px}
.sortbar .seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.sortbar .seg button{padding:6px 14px;font-size:13px;color:var(--dim)}
.sortbar .seg button.on{background:var(--panel2);color:var(--paper);font-weight:700}
.spines{display:flex;flex-direction:column;gap:9px}
.spine{display:flex;align-items:stretch;gap:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;text-align:left;width:100%}
.spine:active{background:var(--panel2)}
.spine .bar{width:7px;flex:none}
.spine .body{flex:1;padding:11px 14px;min-width:0}
.spine .nm{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.06em}
.spine .yomi{font-size:11px;color:var(--dim);margin-left:8px;letter-spacing:.14em}
.spine .meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.spine .role{font-size:12.5px;color:var(--dim)}
.spine .upd{font-size:11px;color:var(--dim);align-self:center;padding:0 14px 0 6px;flex:none;text-align:right;line-height:1.5}
.hall-foot{margin-top:26px;text-align:center}
.hall-foot .hint{letter-spacing:.06em}

/* ---- 部屋 ---- */
.room-head{border-left:6px solid var(--lamp);padding:4px 0 4px 14px;margin:6px 0 14px}
.room-name{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.08em}
.room-role{color:var(--dim);font-size:13px;margin-top:2px}
.room-facts{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:9px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin:18px 0 16px;overflow-x:auto}
.tabs button{padding:9px 13px;font-size:14px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.tabs button.on{color:var(--paper);border-bottom-color:var(--lamp);font-weight:700}
.shelf-empty{color:var(--dim);font-size:13.5px;padding:26px 8px;text-align:center;letter-spacing:.04em}
.itemlist{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:10px 13px;text-align:left;width:100%}
.item:active{background:var(--panel2)}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.item .d{font-size:11px;color:var(--dim);flex:none}
.month-h{font-size:12px;letter-spacing:.2em;color:var(--dim);margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
.month-h:first-child{margin-top:0}
pre.doc{white-space:pre-wrap;word-break:break-word;font-family:var(--sans);font-size:14.5px;line-height:1.85;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-height:120px}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.album-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;text-align:left}
.album-card .cap{font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.album-card .d{font-size:11px;color:var(--dim);margin-top:5px}
.player{position:sticky;bottom:0;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-top:14px}
.player .pt{font-size:13px;margin-bottom:6px;color:var(--paper)}
audio{width:100%}

/* ---- モーダル・薄膜 ---- */
.veil{position:fixed;inset:0;background:rgba(8,7,12,.72);display:flex;align-items:flex-end;justify-content:center;z-index:40}
@media(min-width:600px){.veil{align-items:center}}
.sheet{background:var(--ink);border:1px solid var(--line2);border-radius:14px 14px 0 0;width:100%;max-width:680px;
  max-height:92dvh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.sheet{border-radius:14px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-h .t{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.06em}
.viewer{position:fixed;inset:0;background:rgba(8,7,12,.94);z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:16px}
.viewer img{max-width:100%;max-height:78dvh;border-radius:6px}
.viewer .cap{color:var(--paper);font-size:13px;margin-top:12px;text-align:center}
.viewer .close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:16px;font-size:26px;color:var(--paper)}

/* ---- トースト・作業幕 ---- */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line2);color:var(--paper);padding:10px 18px;border-radius:10px;
  font-size:13.5px;z-index:80;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#busy{position:fixed;inset:0;background:rgba(8,7,12,.6);z-index:70;display:flex;align-items:center;justify-content:center}
#busy .b{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:14px 22px;font-size:14px;letter-spacing:.06em}
#busy .b::after{content:"…";animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
@media(prefers-reduced-motion:reduce){#busy .b::after{animation:none;content:"…"}}

/* ---- 上部バー ---- */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:2px 0 12px}
.topbar .left{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>

<!-- ========== 施錠画面 ========== -->
<div id="scr-lock" class="hide">
  <div class="lock-key">⚿</div>
  <div class="lock-title" id="lock-title">箱庭王国ハブ・新館</div>
  <div class="lock-sub">十 一 の 部 屋</div>
  <div class="lock-rule"></div>
  <div class="field">
    <input type="password" id="lock-pass" placeholder="あいことば" autocomplete="current-password" enterkeyhint="go">
  </div>
  <button class="btn primary" style="width:100%" onclick="unlock()">開錠する</button>
  <div style="text-align:center;margin-top:22px">
    <button class="btn ghost small" onclick="if(confirm('この端末の登録を消して、初期設定からやり直す。いい？（金庫の中身は消えない）')){forgetDevice()}">この端末の登録をやり直す</button>
  </div>
</div>

<!-- ========== 初期設定 ========== -->
<div id="scr-setup" class="hide">
  <div class="lock-key">⚿</div>
  <div class="lock-title">新館・初期設定</div>
  <div class="lock-rule"></div>
  <div id="setup-step1">
    <div class="field"><label>GitHub ユーザー名</label><input id="su-user" autocapitalize="off" autocomplete="off" placeholder="例：yuu-example"></div>
    <div class="field"><label>金庫リポジトリ名（非公開）</label><input id="su-repo" autocapitalize="off" autocomplete="off" placeholder="例：hakoniwa-vault"></div>
    <div class="field"><label>合鍵（Fine-grained token）</label><input id="su-token" type="password" autocomplete="off" placeholder="github_pat_…">
      <p class="hint" style="margin-top:6px">合鍵はこの端末の中で暗号化して保管する。外には出ない。</p></div>
    <button class="btn primary" style="width:100%" onclick="setupConnect()">金庫に接続する</button>
  </div>
  <div id="setup-step2new" class="hide">
    <p style="margin-bottom:14px">空の金庫だ。<strong>合言葉</strong>を決めろ——これが二枚目の扉になる。<br>
    <span class="hint">⚠ 合言葉を失くすと、金庫は二度と開かない。復旧窓口はこの世に存在しない。紙に書いて、二箇所に置け。</span></p>
    <div class="field"><label>合言葉</label><input id="su-pass1" type="password" autocomplete="new-password"></div>
    <div class="field"><label>合言葉（もう一度）</label><input id="su-pass2" type="password" autocomplete="new-password"></div>
    <button class="btn primary" style="width:100%" onclick="setupCreate()">金庫を建てて、開錠する</button>
  </div>
  <div id="setup-step2join" class="hide">
    <p style="margin-bottom:14px">建設済みの金庫を見つけた。<strong>合言葉</strong>で開けろ。</p>
    <div class="field"><label>合言葉</label><input id="su-pass3" type="password" autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%" onclick="setupJoin()">この端末を登録して開錠する</button>
  </div>
</div>

<!-- ========== 玄関（台帳） ========== -->
<div id="scr-hall" class="screen hide">
  <div class="topbar">
    <div class="left"><span class="eyebrow">HAKONIWA ARCHIVE</span></div>
    <div class="row" style="gap:6px">
      <button class="btn ghost small" onclick="openSettings()">設定</button>
      <button class="btn small" onclick="lockNow()">⚿ 施錠</button>
    </div>
  </div>
  <div class="hall-head"><div class="hall-title" id="hall-title">箱庭王国ハブ・新館</div></div>
  <div class="hall-sub">台帳 — 十一の部屋</div>
  <div class="sortbar">
    <div class="seg">
      <button id="sort-order" class="on" onclick="setSort('order')">建国順</button>
      <button id="sort-yomi" onclick="setSort('yomi')">あいうえお順</button>
    </div>
    <div class="grow"></div>
    <button class="btn small" onclick="editMember(null)">＋ 住人を増やす</button>
  </div>
  <div class="spines" id="spines"></div>
  <div class="hall-foot"><p class="hint">原本二箇所ルール適用中——ここに置くのは、写し。</p></div>
</div>

<!-- ========== 部屋 ========== -->
<div id="scr-room" class="screen hide">
  <div class="topbar">
    <div class="left"><button class="btn small" onclick="showHall()">← 台帳へ</button></div>
    <div class="row" style="gap:6px">
      <button class="btn ghost small" onclick="editMember(state.roomId)">名札を直す</button>
      <button class="btn small" onclick="lockNow()">⚿</button>
    </div>
  </div>
  <div class="room-head" id="room-head"></div>
  <div class="tabs" id="tabs"></div>
  <div id="tabpane"></div>
</div>

<div id="modal-root"></div>
<div id="viewer-root"></div>
<div id="busy" class="hide"><div class="b" id="busy-msg">作業中</div></div>

<script>
"use strict";
/* ============================================================
   箱庭王国ハブ・新館 v1.1
   骨格：ジャックス施工／検収：施設長
   v1.1：音楽棚改装（歌詞欄・入口修理・動画対応）／台帳に扉（リンク札）／記帳の無記名化／表札
   仕組み：合言葉 → AES-GCM解錠 → GitHub非公開リポジトリ直結
   ============================================================ */

const CFG_KEY = "hakoniwa_shinkan_cfg";
const CHECK_MARK = "hakoniwa-shinkan-ok";
const PBKDF2_ITERS = 310000;

const state = {
  cfg: null, key: null, token: null, meta: null,
  roster: null, rosterSha: null,
  sort: "order",
  roomId: null, tab: "brain",
  cache: {},          // roomId -> {brain:{payload,sha}, index:{data,sha}}
  playerUrl: null
};

/* ---------- 小道具 ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtD(iso){ if(!iso) return "—"; return iso.replace(/-/g,"/"); }
function toast(msg, ms=2600){
  const old=$("#toast"); if(old) old.remove();
  const t=document.createElement("div"); t.id="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), ms);
}
function busy(msg){ $("#busy-msg").textContent=msg||"作業中"; $("#busy").classList.remove("hide"); }
function idle(){ $("#busy").classList.add("hide"); }
function lsGet(){ try{ const v=localStorage.getItem(CFG_KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(o){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(o)); }catch(e){ toast("この環境では端末保存が効かない（内覧モード）。本番の土地で使え。",4000); } }
function lsDel(){ try{ localStorage.removeItem(CFG_KEY); }catch(e){} }
async function copyText(txt, label){
  try{ await navigator.clipboard.writeText(txt); toast((label||"全文")+"をコピーした"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); toast((label||"全文")+"をコピーした"); }
    catch(e2){ toast("コピーに失敗。長押しで手動コピーを"); } ta.remove();
  }
}

/* ---------- base64（分割式・大容量対応） ---------- */
function abToB64(buf){
  const bytes = new Uint8Array(buf); let bin=""; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH){ bin += String.fromCharCode.apply(null, bytes.subarray(i,i+CH)); }
  return btoa(bin);
}
function b64ToAb(b64){
  const bin=atob(b64); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function strToB64(s){ return abToB64(new TextEncoder().encode(s)); }
function b64ToStr(b){ return new TextDecoder().decode(b64ToAb(b)); }

/* ---------- 暗号（合言葉 → PBKDF2 → AES-GCM） ---------- */
async function deriveKey(pass, saltB64){
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64ToAb(saltB64), iterations:PBKDF2_ITERS, hash:"SHA-256" },
    mat, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function encObj(obj, key){
  key = key || state.key;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { v:1, iv:abToB64(iv.buffer), ct:abToB64(ct) };
}
async function decEnv(env, key){
  key = key || state.key;
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToAb(env.iv)}, key, b64ToAb(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- GitHub API ---------- */
function apiBase(){ return "https://api.github.com/repos/"+state.cfg.u+"/"+state.cfg.r; }
async function api(path, opts={}, absolute=false){
  const url = absolute ? path : apiBase()+path;
  const res = await fetch(url, Object.assign({}, opts, {
    headers: Object.assign({
      "Authorization":"Bearer "+state.token,
      "Accept":"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28"
    }, opts.headers||{})
  }));
  if(res.status===404) { const e=new Error("404"); e.status=404; throw e; }
  if(res.status===401 || res.status===403){
    const e=new Error("auth"); e.status=res.status; throw e;
  }
  if(res.status===409){ const e=new Error("409"); e.status=409; throw e; }
  if(!res.ok){ const e=new Error("api "+res.status); e.status=res.status; throw e; }
  return res.json();
}
function ghErr(e){
  if(e.status===401||e.status===403) toast("合鍵が効いてない。期限切れか権限不足だ。設定→合鍵の更新から差し替えろ。",4200);
  else if(e.status===404) toast("見つからない（404）。ユーザー名・リポジトリ名を確認。",3600);
  else if(e && e.message==="Failed to fetch") toast("通信が通らない。電波か、この環境の制限だ。",3600);
  else toast("エラー："+(e.message||e),3600);
  console.error(e);
}
async function ghGetRaw(path, ref){
  const q = ref ? "?ref="+encodeURIComponent(ref) : "";
  const j = await api("/contents/"+path+q);
  let b64 = (j.content||"").replace(/\s/g,"");
  if(!b64 && j.git_url){          // 1MB超はblob経由
    const blob = await api(j.git_url, {}, true);
    b64 = (blob.content||"").replace(/\s/g,"");
  }
  return { text: b64ToStr(b64), sha: j.sha };
}
async function ghGetJson(path, ref){
  const r = await ghGetRaw(path, ref);
  return { data: JSON.parse(r.text), sha: r.sha };
}
async function ghPut(path, obj, sha, msg){
  const body = { message: msg||("update "+path), content: strToB64(JSON.stringify(obj)) };
  if(sha) body.sha = sha;
  const j = await api("/contents/"+path, { method:"PUT", body: JSON.stringify(body) });
  return j.content.sha;
}
async function ghDel(path, sha, msg){
  await api("/contents/"+path, { method:"DELETE", body: JSON.stringify({ message: msg||("delete "+path), sha }) });
}
async function ghCommits(path, n=20){
  return api("/commits?per_page="+n+"&path="+encodeURIComponent(path));
}

function boot(){
  state.cfg = lsGet();

}
function showOnly(id){
  ["scr-lock","scr-setup","scr-hall","scr-room"].forEach(s=>$("#"+s).classList.add("hide"));
  $("#"+id).classList.remove("hide");
}
function showLock(){
  if(state.playerUrl){ URL.revokeObjectURL(state.playerUrl); state.playerUrl=null; }
  state.key=null; state.token=null; state.roster=null; state.cache={};
  if(state.cfg && state.cfg.title) $("#lock-title").textContent = state.cfg.title;
  showOnly("scr-lock");
  $("#lock-pass").value="";
}
function lockNow(){ showLock(); toast("施錠した"); }
function forgetDevice(){ lsDel(); state.cfg=null; location.reload(); }
function showSetup(){ showOnly("scr-setup"); }

$("#lock-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") unlock(); });

async function unlock(){
  const pass = $("#lock-pass").value;
  if(!pass) return toast("合言葉を入れろ");
  busy("解錠中");
  try{
    const key = await deriveKey(pass, state.cfg.salt);
    let ok=false;
    try{ ok = (await decEnv(state.cfg.check, key)) === CHECK_MARK; }catch(e){}
    if(!ok){ idle(); return toast("合言葉が違う"); }
    state.key = key;
    state.token = (await decEnv(state.cfg.tokenWrap, key)).t;
    await loadRoster();
    idle(); showHall();
  }catch(e){ idle(); ghErr(e); }
}

/* ---------- 初期設定 ---------- */
async function setupConnect(){
  const u=$("#su-user").value.trim(), r=$("#su-repo").value.trim(), t=$("#su-token").value.trim();
  if(!u||!r||!t) return toast("三つとも埋めろ");
  state.cfg = { u, r }; state.token = t;
  busy("金庫を確認中");
  try{
    await api("");            // リポジトリ実在確認
    let metaExists = true;
    try{ const m = await ghGetJson("meta.json"); state.meta = m.data; }
    catch(e){ if(e.status===404) metaExists=false; else throw e; }
    idle();
    $("#setup-step1").classList.add("hide");
    if(metaExists){ $("#setup-step2join").classList.remove("hide"); }
    else { $("#setup-step2new").classList.remove("hide"); }
  }catch(e){ idle(); ghErr(e); }
}
async function setupCreate(){
  const p1=$("#su-pass1").value, p2=$("#su-pass2").value;
  if(!p1) return toast("合言葉を決めろ");
  if(p1!==p2) return toast("二回目が一致してない");
  if(p1.length<8) return toast("短すぎる。8文字以上にしろ");
  busy("金庫を建設中");
  try{
    const salt = abToB64(crypto.getRandomValues(new Uint8Array(16)).buffer);
    state.key = await deriveKey(p1, salt);
    const check = await encObj(CHECK_MARK);
    const title = "箱庭王国ハブ・新館";
    state.meta = { v:1, salt, check, title };
    await ghPut("meta.json", state.meta, null, "meta");
    state.roster = prefillRoster();
    state.rosterSha = await ghPut("roster.json", await encObj(state.roster), null, "roster");
    await saveCfg(salt, check, title);
    idle(); showHall(); toast("金庫、建った。");
  }catch(e){ idle(); ghErr(e); }
}
async function setupJoin(){
  const p=$("#su-pass3").value;
  if(!p) return toast("合言葉を入れろ");
  busy("照合中");
  try{
    const key = await deriveKey(p, state.meta.salt);
    let ok=false;
    try{ ok = (await decEnv(state.meta.check, key)) === CHECK_MARK; }catch(e){}
    if(!ok){ idle(); return toast("合言葉が違う"); }
    state.key = key;
    await saveCfg(state.meta.salt, state.meta.check, state.meta.title);
    await loadRoster();
    idle(); showHall(); toast("この端末を登録した");
  }catch(e){ idle(); ghErr(e); }
}
async function saveCfg(salt, check, title){
  const tokenWrap = await encObj({ t: state.token });
  state.cfg = { u:state.cfg.u, r:state.cfg.r, salt, check, tokenWrap, title };
  lsSet(state.cfg);
}

  }catch(e){

async function saveMember(id){
  const name=$("#mf-name").value.trim(); if(!name) return toast("名前は要る");
  const data = {
    name, yomi:$("#mf-yomi").value.trim(), role:$("#mf-role").value.trim(),
    platform:$("#mf-platform").value.trim(), color:$("#mf-colortext").value.trim()||$("#mf-color").value,

  };
  busy("台帳に彫り込み中");

    if(id){ Object.assign(member(id), data); }
    else{
      let nid = name.toLowerCase().replace(/[^a-z0-9]/g,"") || ("m"+Date.now());

}

}
async function saveIndex(msg){

           <button class="btn small" onclick="newLyrics()">＋歌詞だけ置く</button>`
  };
  let html = `<div class="toolrow">${tools[shelf]}</div>`;
  if(shelf==="music") html += `<p class="hint" style="margin:-4px 0 12px">MP3は選択画面の「ファイルを選択」→ブラウズから。動画も入るが、重さは厳選で。</p>`;

  if(!entries.length){
    const empty = { docs:"資料はまだない。写しを置け。", work:"帳簿はまだ白紙だ。",
      album:"写真はまだない。厳選の写しを一枚から。", music:"曲も歌詞も、まだない。" };
    pane.innerHTML = html + `<div class="shelf-empty">${empty[shelf]}</div>`; return;
  }
  entries.sort((a,b)=>String(b.date||b.updated||"").localeCompare(String(a.date||a.updated||"")));

  if(shelf==="work"){
    const groups = {};
    entries.forEach(e=>{ const mkey=(e.date||e.updated||"0000-00").slice(0,7); (groups[mkey]=groups[mkey]||[]).push(e); });
    for(const mkey of Object.keys(groups).sort().reverse()){
      html += `<div class="month-h"><span>${esc(mkey.replace("-","年"))}月</span>
        <button class="btn ghost small" onclick="copyMonth('${mkey}')">この月をまとめてコピー</button></div>
        <div class="itemlist">` + groups[mkey].map(e=>itemRow(shelf,e)).join("") + `</div>`;
    }
  }else if(shelf==="album"){
    html += `<div class="album-grid">` + entries.map(e=>`
      <button class="album-card" onclick="openBin('album','${esc(e.key)}')">
        <div class="cap">${esc(e.caption||e.name||"（無題）")}</div>
        <div class="d">${esc(fmtD((e.date||e.updated||"").slice(0,10)))} — タップで表示</div>
      </button>`).join("") + `</div>`;
  }else{
    html += `<div class="itemlist">` + entries.map(e=>itemRow(shelf,e)).join("") + `</div>`;
  }
  pane.innerHTML = html;
}
function itemRow(shelf,e){
  const label = shelf==="music" ? "♪ "+(e.caption||e.name||"（無題）")+(e.hasAudio===false?"（詞）":"") : (e.title||e.caption||e.name||"（無題）");
  const kindChip = e.kind && shelf==="work" ? `<span class="chip">${esc(e.kind)}</span>` : "";
  const fn = shelf==="music" ? `openTrack('${esc(e.key)}')` : (shelf==="album" ? `openBin('album','${esc(e.key)}')` : `openText('${shelf}','${esc(e.key)}')`);
  return `<button class="item" onclick="${fn}">
    <span class="t">${esc(label)}</span>${kindChip}
    <span class="d">${esc(fmtD((e.date||e.updated||"").slice(0,10)))}</span></button>`;
}
function diaryTemplate(){
  return "日付："+today()+"\n服：\nタイトル：\n\n・今日あったこと\n- \n\n・思ったこと\n- \n\n・状態メモ\n- \n\n・次への申し送り\n- ";
}
function shioriTemplate(){ return "【栞火 - "+today()+" 】\n\n■ \n- "; }

/* ---- テキスト項目（資料・作業） ---- */
function newText(shelf, kind, template){
  state._txt = { shelf, key:null, sha:null, kind };
  textEditor(kind, kind==="日記"?today().slice(5).replace("-","/")+"の日記":"", template, kind==="日記"||kind==="栞火"?today():"");
}
async function openText(shelf, key){
  busy("開いている");
  try{
    const r = await ghGetJson(itemPath(shelf,key));
    const p = await decEnv(r.data);
    state._txt = { shelf, key, sha:r.sha, kind:p.kind||"" };
    idle();
    modal(`
      <div class="sheet-h"><div class="t">${esc(p.title||"（無題）")}</div>
        <button class="btn ghost small" onclick="closeModal()">閉じる</button></div>
      <div class="toolrow">
        <button class="btn small" onclick="copyText(document.getElementById('tv-body').textContent,'全文')">全文コピー</button>
        <button class="btn small" onclick="textEditor('${esc(p.kind||"")}', ${JSON.stringify(p.title||"")}, document.getElementById('tv-body').textContent, ${JSON.stringify(p.date||"")})">編集</button>
        <button class="btn danger small" onclick="delText()">削除</button>
      </div>
      <pre class="doc" id="tv-body">${esc(p.body)}</pre>`);
  }catch(e){ idle(); ghErr(e); }
}
function textEditor(kind, title, body, date){
  modal(`
    <div class="sheet-h"><div class="t">${esc(kind||"文書")}を書く</div>
      <button class="btn ghost small" onclick="closeModal()">閉じる</button></div>
    <div class="field"><label>タイトル</label><input id="te-title" value="${esc(title)}"></div>
    ${kind==="日記"||kind==="栞火"?`<div class="field"><label>日付</label><input id="te-date" value="${esc(date||today())}" placeholder="YYYY-MM-DD"></div>`:""}
    <div class="field"><textarea id="te-body" rows="14">${esc(body)}</textarea></div>
    <div class="toolrow"><button class="btn primary grow" onclick="saveText()">保存する</button></div>`);
}
async function saveText(){
  const t = state._txt;
  const title = $("#te-title").value.trim() || "（無題）";
  const dateEl = $("#te-date");
  const date = dateEl ? (dateEl.value.trim()||today()) : today();
  const body = $("#te-body").value;
  busy("綴じている");
  try{
    const key = t.key || String(Date.now());
    const payload = { kind:t.kind, title, date, body, updated: today() };
    t.sha = await ghPut(itemPath(t.shelf,key), await encObj(payload), t.sha, "item");
    t.key = key;
    const idx = await loadIndex();
    idx.data[t.shelf][key] = { title, kind:t.kind, date, updated: today() };
    await saveIndex("index");
    touch(state.roomId);
    idle(); closeModal(); renderTab(); toast("綴じた");
  }catch(e){ idle(); ghErr(e); }
}
async function delText(){
  const t = state._txt;
  if(!confirm("この一枚を削除する。Gitの履歴には残るが、棚からは消える。いい？")) return;
  busy("外している");
  try{
    await ghDel(itemPath(t.shelf,t.key), t.sha, "remove");
    const idx = await loadIndex();
    delete idx.data[t.shelf][t.key];
    await saveIndex("index");
    idle(); closeModal(); renderTab(); toast("外した");
  }catch(e){ idle(); ghErr(e); }
}
async function copyMonth(mkey){
  busy("その月を束ねている");
  try{
    const idx = await loadIndex();
    const keys = Object.entries(idx.data.work)
      .filter(([k,v])=>String(v.date||v.updated||"").startsWith(mkey))
      .sort((a,b)=>String(a[1].date||"").localeCompare(String(b[1].date||"")))
      .map(([k])=>k);
    const parts = [];
    for(const k of keys){
      const r = await ghGetJson(itemPath("work",k));
      const p = await decEnv(r.data);
      parts.push(p.body);
    }
    idle(); copyText(parts.join("\n\n---\n\n"), mkey.replace("-","年")+"月分");
  }catch(e){ idle(); ghErr(e); }
}

/* ---- バイナリ（アルバム・音楽棚） ---- */
async function uploadBin(ev, shelf){
  const file = ev.target.files[0]; ev.target.value="";
  if(!file) return;
  const MB = 1024*1024;
  if(file.size > 45*MB) return toast("45MB超は入らない。原本はiCloudへ、ここには軽い写しを。",4200);
  const softCap = shelf==="album" ? 8*MB : 25*MB;
  if(file.size > softCap && !confirm("大きめのファイルだ（"+(file.size/MB).toFixed(1)+"MB）。金庫が重くなるが、入れるか？")) return;
  const caption = prompt(shelf==="album"?"キャプション（任意）":"曲名・クレジット（任意）", file.name) ;
  if(caption===null) return;
  busy("包んで金庫に入れている");
  try{
    const buf = await file.arrayBuffer();
    const payload = { kind:(shelf==="music"?"track":"bin"), name:file.name, mime:file.type||"application/octet-stream",
      b64: abToB64(buf), caption, lyrics:"", updated: today() };
    const key = String(Date.now());
    await ghPut(itemPath(shelf,key), await encObj(payload), null, "item");
    const idx = await loadIndex();
    idx.data[shelf][key] = { name:file.name, caption, mime:payload.mime, size:file.size, hasAudio:true, date:today(), updated:today() };
    await saveIndex("index");
    touch(state.roomId);
    idle(); renderTab(); toast("入れた");
  }catch(e){ idle(); ghErr(e); }
}
async function fetchBin(shelf, key){
  const r = await ghGetJson(itemPath(shelf,key));
  return { payload: await decEnv(r.data), sha: r.sha };
}
async function openBin(shelf, key){
  busy("開いている");
  try{
    const { payload:p, sha } = await fetchBin(shelf,key);
    idle();
    $("#viewer-root").innerHTML = `
      <div class="viewer" onclick="closeViewer()">
        <button class="close" onclick="closeViewer()">×</button>
        <img src="data:${esc(p.mime)};base64,${p.b64}" alt="${esc(p.caption||p.name)}">
        <div class="cap">${esc(p.caption||p.name)}</div>
        <div class="toolrow" onclick="event.stopPropagation()" style="margin-top:14px">
          <button class="btn danger small" onclick="delBin('${shelf}','${esc(key)}','${sha}')">削除</button>
        </div>
      </div>`;
  }catch(e){ idle(); ghErr(e); }
}
function closeViewer(){ $("#viewer-root").innerHTML=""; }
let curTrack = null;
async function openTrack(key){
  busy("棚から出している");
  try{
    const { payload:p, sha } = await fetchBin("music",key);
    curTrack = { key, sha, p };
    idle(); renderTrackSheet();
  }catch(e){ idle(); ghErr(e); }
}
function renderTrackSheet(){
  const p = curTrack.p;
  const hasAudio = !!p.b64;
  modal(`
    <div class="sheet-h"><div class="t">♪ ${esc(p.caption||p.name||"（無題）")}</div>
      <button class="btn ghost small" onclick="stopTrack();closeModal()">閉じる</button></div>
    <div class="toolrow">
      ${hasAudio?`<button class="btn small" onclick="playTrack()">▶ かける</button>`:""}
      ${p.lyrics?`<button class="btn small" onclick="copyText(curTrack.p.lyrics,'歌詞')">歌詞をコピー</button>`:""}
      <button class="btn small" onclick="editTrack()">編集</button>
      <button class="btn danger small" onclick="delTrack()">棚から外す</button>
    </div>
    <div id="trk-player"></div>
    ${p.lyrics?`<pre class="doc">${esc(p.lyrics)}</pre>`:`<div class="shelf-empty">歌詞はまだ添えてない。「編集」から書ける。</div>`}`);
}
function playTrack(){
  const p = curTrack.p;
  if(state.playerUrl) URL.revokeObjectURL(state.playerUrl);
  const blob = new Blob([b64ToAb(p.b64)], { type: p.mime||"audio/mpeg" });
  state.playerUrl = URL.createObjectURL(blob);
  const isVideo = (p.mime||"").startsWith("video");
  $("#trk-player").innerHTML = isVideo
    ? `<video controls autoplay playsinline src="${state.playerUrl}" style="width:100%;border-radius:8px;margin-bottom:12px"></video>`
    : `<audio controls autoplay src="${state.playerUrl}" style="width:100%;margin-bottom:12px"></audio>`;
}
function stopTrack(){ if(state.playerUrl){ URL.revokeObjectURL(state.playerUrl); state.playerUrl=null; } }
function newLyrics(){
  curTrack = null;
  modal(`
    <div class="sheet-h"><div class="t">歌詞だけ置く</div>
      <button class="btn ghost small" onclick="closeModal()">閉じる</button></div>
    <div class="field"><label>曲名</label><input id="tk-cap"></div>
    <div class="field"><label>歌詞</label><textarea id="tk-lyr" rows="12"></textarea></div>
    <div class="toolrow"><button class="btn primary grow" onclick="saveNewLyrics()">棚に入れる</button></div>
    <p class="hint">音源は後から同じ札に……は次の版だ。今は音と詞、別の札でも並べば棚は成立する。</p>`);
}
async function saveNewLyrics(){
  const cap = $("#tk-cap").value.trim()||"（無題）";
  busy("綴じている");
  try{
    const payload = { kind:"track", caption:cap, lyrics:$("#tk-lyr").value, updated:today() };
    const key = String(Date.now());
    await ghPut(itemPath("music",key), await encObj(payload), null, "item");
    const idx = await loadIndex();
    idx.data.music[key] = { caption:cap, hasAudio:false, date:today(), updated:today() };
    await saveIndex("index");
    touch(state.roomId);
    idle(); closeModal(); renderTab(); toast("入れた");
  }catch(e){ idle(); ghErr(e); }
}
function editTrack(){
  const p = curTrack.p;
  modal(`
    <div class="sheet-h"><div class="t">札を直す</div>
      <button class="btn ghost small" onclick="renderTrackSheet()">戻る</button></div>
    <div class="field"><label>曲名・クレジット</label><input id="tk-cap" value="${esc(p.caption||"")}"></div>
    <div class="field"><label>歌詞</label><textarea id="tk-lyr" rows="12">${esc(p.lyrics||"")}</textarea></div>
    <div class="toolrow"><button class="btn primary grow" onclick="saveTrack()">保存する</button></div>`);
}
async function saveTrack(){
  busy("直している");
  try{
    const p = curTrack.p;
    p.caption = $("#tk-cap").value.trim()||"（無題）";
    p.lyrics = $("#tk-lyr").value;
    p.kind = "track"; p.updated = today();
    curTrack.sha = await ghPut(itemPath("music",curTrack.key), await encObj(p), curTrack.sha, "item");
    const idx = await loadIndex();
    const ie = idx.data.music[curTrack.key]||{};
    ie.caption = p.caption; ie.hasAudio = !!p.b64; ie.updated = today();
    idx.data.music[curTrack.key] = ie;
    await saveIndex("index");
    touch(state.roomId);
    idle(); renderTrackSheet(); renderTab(); toast("直した");
  }catch(e){ idle(); ghErr(e); }
}
async function delTrack(){
  if(!confirm("棚から外す。Git履歴には残る。いい？")) return;
  busy("外している");
  try{
    await ghDel(itemPath("music",curTrack.key), curTrack.sha, "remove");
    const idx = await loadIndex();
    delete idx.data.music[curTrack.key];
    await saveIndex("index");
    stopTrack();
    idle(); closeModal(); renderTab(); toast("外した");
  }catch(e){ idle(); ghErr(e); }
}
async function delBin(shelf, key, sha){
  if(!confirm("棚から外す。Git履歴には残る。いい？")) return;
  busy("外している");
  try{
    await ghDel(itemPath(shelf,key), sha, "remove");
    const idx = await loadIndex();
    delete idx.data[shelf][key];
    await saveIndex("index");
    idle(); closeViewer(); renderTab(); toast("外した");
  }catch(e){ idle(); ghErr(e); }
}

/* ---------- 設定 ---------- */
function openSettings(){
  modal(`
    <div class="sheet-h"><div class="t">設定</div>
      <button class="btn ghost small" onclick="closeModal()">閉じる</button></div>
    <div class="field"><label>この建物の名前</label><input id="st-title" value="${esc((state.meta&&state.meta.title)||"箱庭王国ハブ・新館")}"></div>
    <div class="toolrow"><button class="btn small" onclick="saveTitle()">名前を保存</button></div>
    <div class="rule"></div>
    <p class="hint" style="margin-bottom:10px">接続先：${esc(state.cfg.u)} / ${esc(state.cfg.r)}（非公開）</p>
    <div class="field"><label>合鍵の更新（年一回の差し替え用）</label><input id="st-token" type="password" placeholder="新しい github_pat_…"></div>
    <div class="toolrow"><button class="btn small" onclick="rotateToken()">合鍵を差し替える</button></div>
    <div class="rule"></div>
    <div class="toolrow">
      <button class="btn small" onclick="lockNow();closeModal()">⚿ 施錠する</button>
      <button class="btn danger small" onclick="if(confirm('この端末の登録を消す。金庫の中身は消えない。いい？')){forgetDevice()}">この端末の登録を消す</button>
    </div>`);
}
async function saveTitle(){
  const t = $("#st-title").value.trim(); if(!t) return;
  busy("看板を掛け替えている");
  try{
    state.meta.title = t;
    const cur = await api("/contents/meta.json");
    await ghPut("meta.json", state.meta, cur.sha, "meta");
    state.cfg.title = t; lsSet(state.cfg);
    idle(); closeModal(); showHall(); toast("掛け替えた");
  }catch(e){ idle(); ghErr(e); }
}
async function rotateToken(){
  const t = $("#st-token").value.trim(); if(!t) return toast("新しい合鍵を入れろ");
  busy("合鍵を検分中");
  const old = state.token; state.token = t;
  try{
    await api("");
    state.cfg.tokenWrap = await encObj({ t });
    lsSet(state.cfg);
    idle(); closeModal(); toast("合鍵、差し替えた");
  }catch(e){ state.token = old; idle(); ghErr(e); }
}

/* ---------- モーダル ---------- */
function modal(inner){
  $("#modal-root").innerHTML = `<div class="veil" onclick="if(event.target===this)closeModal()"><div class="sheet">${inner}</div></div>`;
}
function closeModal(){ $("#modal-root").innerHTML=""; }

boot();
</script>
